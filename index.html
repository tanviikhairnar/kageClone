<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ni Square Packaging — Bespoke Hampers &amp; Luxury Packaging Atelier</title>
    <meta name="description" content="Thoughtfully curated hampers and bespoke packaging by Ni Square Packaging. Handcrafted for weddings, celebrations, festivals, corporate gifting, and return favours." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --color-burgundy: #3B172D;
        --color-wine: #702C49;
        --color-blush: #F4EAF0;
        --color-gold: #D6B77A;
        --color-gold-light: #ebd8ad;
        --color-ivory: #F8F3EB;
        --font-serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        background-color: var(--color-burgundy);
        color: var(--color-ivory);
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: var(--color-burgundy);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        width: 100%;
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
